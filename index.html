<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="日常会話や海外コンテンツの英語を学ぶ、端末内保存対応の英単語学習アプリ。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="public/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>WordStep | 英単語トレーナー</title>
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brandHome" aria-label="ホームへ戻る"><span class="brand-mark">W</span><span>WordStep</span></button>
    <button class="icon-button" id="installButton" hidden aria-label="アプリをインストール">＋ アプリ追加</button>
  </header>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="loading-panel"><div class="loader"></div><p>単語データを読み込んでいます…</p></section>
  </main>
  <footer class="footer"><span>WordStep v1.0</span><span>学習記録はこの端末に保存されます</span></footer>
  <script src="app.js" defer></script>
</body>
</html>
